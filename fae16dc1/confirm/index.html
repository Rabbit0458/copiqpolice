<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Confirmation email | COP'IQ</title>
<meta name="description" content="Confirmation de votre adresse email COP'IQ." />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0B102A" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    color-scheme: light dark;
    --brand: #1147D9;
    --brand-mid: #1A55E6;
    --surface: #FFFFFF;
    --surface-container: #F4F6FB;
    --outline: #D5DBE8;
    --on-surface: #0F172A;
    --on-surface-muted: #475569;
    --on-surface-faint: #94A3B8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #0B102A;
      --surface-container: #0F1438;
      --outline: #1F2A52;
      --on-surface: #F8FAFC;
      --on-surface-muted: #94A3B8;
      --on-surface-faint: #64748B;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--surface);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .logo {
    width: 64px;
    height: 64px;
    object-fit: contain;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp .5s cubic-bezier(.16,1,.3,1) forwards;
  }
  .icon-wrap {
    width: 96px;
    height: 96px;
    position: relative;
    opacity: 0;
    animation: pop .55s cubic-bezier(.16,1,.3,1) .1s forwards,
               settle .4s cubic-bezier(.34,1.56,.64,1) .85s forwards;
  }
  .glow {
    position: absolute;
    inset: -24px;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    animation: glowPulse 1.1s ease-out .5s forwards;
  }
  h1 {
    color: var(--on-surface);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin: 28px 0 8px;
    opacity: 0;
    animation: fadeUp .5s cubic-bezier(.16,1,.3,1) .2s forwards;
  }
  p.msg {
    color: var(--on-surface-muted);
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 4px;
    opacity: 0;
    animation: fadeUp .5s cubic-bezier(.16,1,.3,1) .28s forwards;
  }
  p.detail {
    color: var(--on-surface-faint);
    font-size: 12px;
    line-height: 1.5;
    margin: 0 0 8px;
    opacity: 0;
    animation: fadeUp .5s cubic-bezier(.16,1,.3,1) .32s forwards;
  }
  .actions {
    width: 100%;
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    opacity: 0;
    animation: fadeUp .5s cubic-bezier(.16,1,.3,1) .38s forwards;
  }
  .btn {
    width: 100%;
    height: 48px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform .15s, background .15s, color .15s;
    font-family: inherit;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-mid); }
  .btn-ghost { background: transparent; color: var(--on-surface-muted); font-weight: 500; }
  .btn-ghost:hover { color: var(--on-surface); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.7); }
    60% { opacity: 1; transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes glowPulse {
    0% { opacity: 0; transform: scale(.6); }
    45% { opacity: 1; transform: scale(1.05); }
    100% { opacity: 0; transform: scale(1.7); }
  }
  @keyframes settle {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .circle-draw {
    stroke-dasharray: 264;
    stroke-dashoffset: 264;
    animation: draw .6s ease-out .15s forwards;
  }
  .check-draw {
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
    animation: draw .35s ease-out .55s forwards;
  }
  .cross-draw-1, .cross-draw-2 {
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    animation: draw .3s ease-out forwards;
  }
  .cross-draw-1 { animation-delay: .5s; }
  .cross-draw-2 { animation-delay: .68s; }
  .spin { transform-origin: 48px 48px; animation: spin 1s linear infinite; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <img class="logo" alt="COP'IQ"
      src="https://nuoonagnkhbeeymtvrcn.supabase.co/storage/v1/object/public/assets/logo_gris.png" />

    <div class="icon-wrap" id="icon-wrap"></div>

    <h1 id="title">Vérification…</h1>
    <p class="msg" id="message">Un instant, on confirme ton adresse email.</p>
    <p class="detail" id="detail" style="display:none"></p>

    <div class="actions" id="actions" style="display:none"></div>
  </div>
</div>

<script>
(function () {
  var SUPABASE_URL = "https://nuoonagnkhbeeymtvrcn.supabase.co";

  var iconWrap = document.getElementById("icon-wrap");
  var titleEl = document.getElementById("title");
  var msgEl = document.getElementById("message");
  var detailEl = document.getElementById("detail");
  var actionsEl = document.getElementById("actions");

  var SVG_NS = "http://www.w3.org/2000/svg";

  function svgIcon(status) {
    var color = status === "loading" ? "#1147D9" : status === "success" ? "#22C55E" : "#EF4444";
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("width", "96");
    svg.setAttribute("height", "96");
    svg.setAttribute("viewBox", "0 0 96 96");
    svg.setAttribute("fill", "none");

    var circle = document.createElementNS(SVG_NS, "circle");
    circle.setAttribute("cx", "48");
    circle.setAttribute("cy", "48");
    circle.setAttribute("r", "42");
    circle.setAttribute("stroke", color);
    circle.setAttribute("stroke-width", "3");
    circle.setAttribute("stroke-linecap", "round");
    if (status === "loading") {
      circle.setAttribute("class", "spin");
      circle.style.opacity = "0.25";
    } else {
      circle.setAttribute("class", "circle-draw");
    }
    svg.appendChild(circle);

    if (status === "loading") {
      var arc = document.createElementNS(SVG_NS, "path");
      arc.setAttribute("d", "M48 6a42 42 0 0 1 42 42");
      arc.setAttribute("stroke", color);
      arc.setAttribute("stroke-width", "3");
      arc.setAttribute("stroke-linecap", "round");
      arc.setAttribute("class", "spin");
      svg.appendChild(arc);
    } else if (status === "success") {
      var check = document.createElementNS(SVG_NS, "path");
      check.setAttribute("d", "M30 49l12 12 24-26");
      check.setAttribute("stroke", color);
      check.setAttribute("stroke-width", "4.5");
      check.setAttribute("stroke-linecap", "round");
      check.setAttribute("stroke-linejoin", "round");
      check.setAttribute("class", "check-draw");
      svg.appendChild(check);
    } else {
      var c1 = document.createElementNS(SVG_NS, "path");
      c1.setAttribute("d", "M34 34l28 28");
      c1.setAttribute("stroke", color);
      c1.setAttribute("stroke-width", "4.5");
      c1.setAttribute("stroke-linecap", "round");
      c1.setAttribute("class", "cross-draw-1");
      svg.appendChild(c1);
      var c2 = document.createElementNS(SVG_NS, "path");
      c2.setAttribute("d", "M62 34L34 62");
      c2.setAttribute("stroke", color);
      c2.setAttribute("stroke-width", "4.5");
      c2.setAttribute("stroke-linecap", "round");
      c2.setAttribute("class", "cross-draw-2");
      svg.appendChild(c2);
    }
    return svg;
  }

  function render(status, title, message, detail) {
    iconWrap.innerHTML = "";
    if (status !== "loading") {
      var glow = document.createElement("div");
      glow.className = "glow";
      glow.style.background =
        "radial-gradient(circle, " +
        (status === "success" ? "rgba(34,197,94,.4)" : "rgba(239,68,68,.4)") +
        ", transparent 70%)";
      iconWrap.appendChild(glow);
    }
    iconWrap.appendChild(svgIcon(status));
    titleEl.textContent = title;
    msgEl.textContent = message;
    if (detail) {
      detailEl.textContent = detail;
      detailEl.style.display = "block";
    } else {
      detailEl.style.display = "none";
    }
  }

  function showSuccessActions() {
    actionsEl.style.display = "flex";
    actionsEl.innerHTML =
      '<a class="btn btn-primary" href="copiq://">Ouvrir l’application</a>' +
      '<a class="btn btn-ghost" href="/login">Se connecter sur le web</a>';
  }

  function showErrorActions() {
    actionsEl.style.display = "flex";
    actionsEl.innerHTML =
      '<a class="btn btn-primary" href="copiq://">Ouvrir l’application</a>' +
      '<a class="btn btn-ghost" href="/login">Se connecter sur le web</a>';
  }

  function verify() {
    var params = new URLSearchParams(window.location.search);
    var hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    var token_hash = params.get("token_hash");
    var type = params.get("type");
    var code = params.get("code");
    var error = params.get("error") || hashParams.get("error");
    var error_description = params.get("error_description") || hashParams.get("error_description");
    var urlStatus = params.get("status");
    var accessToken = hashParams.get("access_token");

    // Retour de GoTrue après redirection native (voir plus bas) : succès si un
    // access_token est présent dans le hash, échec si error/error_description.
    if (error || error_description) {
      var msg = decodeURIComponent(error_description || error || "Erreur inconnue");
      render("error", "Échec de la confirmation", "Ce lien est invalide, expiré, ou déjà utilisé.", msg);
      showErrorActions();
      history.replaceState(null, "", "/confirm");
      return;
    }
    if (accessToken || urlStatus === "success") {
      render("success", "Email confirmé", "Ton compte COP'IQ est activé.");
      showSuccessActions();
      history.replaceState(null, "", "/confirm?status=success");
      return;
    }

    // Flux PKCE : le lien de l'email pointe vers l'endpoint GoTrue de Supabase,
    // qui confirme l'email CÔTÉ SERVEUR puis redirige ici avec ?code=... AVANT
    // qu'on arrive sur cette page. Ce code sert uniquement à établir une session
    // web (via exchangeCodeForSession) — impossible ici puisque l'inscription
    // vient de l'app mobile, pas de ce navigateur (le code_verifier PKCE est
    // stocké côté app, pas accessible depuis Safari). Mais la confirmation
    // d'email, elle, a déjà réussi avant même cette redirection : sa seule
    // présence (sans erreur) suffit à afficher le succès.
    if (code) {
      render("success", "Email confirmé", "Ton compte COP'IQ est activé.");
      showSuccessActions();
      history.replaceState(null, "", "/confirm?status=success");
      return;
    }

    if (!token_hash || !type) {
      render("error", "Échec de la confirmation", "Aucun paramètre de confirmation dans le lien.");
      showErrorActions();
      return;
    }

    // Redirection native (pas de fetch()) vers l'endpoint GoTrue qui vérifie le
    // token côté serveur puis redirige ici avec le résultat. Évite les soucis de
    // CORS/preflight rencontrés avec un appel fetch() direct à /auth/v1/verify.
    var redirectTo = window.location.origin + "/confirm";
    window.location.replace(
      SUPABASE_URL + "/auth/v1/verify?token_hash=" + encodeURIComponent(token_hash) +
      "&type=" + encodeURIComponent(type) +
      "&redirect_to=" + encodeURIComponent(redirectTo)
    );
  }

  verify();
})();
</script>
</body>
</html>
