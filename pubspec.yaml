name: copiqpolice
description: "COP’IQ - Application scolaire de préparation pour la Police Nationale"
publish_to: "none"
version: 1.0.0+2
environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # CODE-082 : i18n — date/number formatting, ARB-generated strings
  intl: 0.20.2
  # --- runtime packages ---
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  google_fonts: ^8.2.1
  permission_handler: ^13.0.1
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.2
  hive_flutter: ^1.1.0
  like_button: ^2.1.0
  particles_flutter: ^3.2.0
  vibration: ^3.2.0
  device_info_plus: 13.2.0
  # flutter_localization (package tiers, singulier) retiré le 2026-08-18 :
  #   • aucun fichier .dart du projet ne l'importait
  #   • son android/build.gradle.kts 0.4.1 casse la build Android
  #     (bloc `kotlin { compilerOptions { } }` sans accesseur généré)
  # La localisation passe par flutter_localizations (SDK Flutter) + intl,
  # déclarés plus haut. Ne pas le réintroduire sans vérifier sa build Gradle.
  hive: ^2.2.3
  audioplayers: ^6.8.1
  # `lib` (package tiers) retiré le 2026-08-18 : aucun `import 'package:lib/...'`
  # dans le projet. Dart pur, sans code natif, donc sans impact sur la build.
  package_info_plus: 10.2.1
  lottie: ^3.5.1
  flutter_animate: ^4.5.2
  flutter_animated_button: ^2.0.4
  go_router: ^17.5.0
  uuid: ^4.6.0
  image_picker: ^1.2.3
  # Monetisation utilisateurs gratuits (interstitial fin de quiz + rewarded)
  google_mobile_ads: ^9.1.0
  # Notifications locales (rappel quotidien, fin de quiz)
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  # Deep links + universal links
  app_links: ^7.2.1
  # Analytics + crash reporting
  # CODE-069 : partage de score (capture RepaintBoundary → PNG → share natif)
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  # CODE-070 : export PDF de la copie corrigée (A4 + entête COP'IQ + watermark)
  pdf: ^3.13.0
  printing: ^5.15.0
  # Centre juridique : rendu Markdown des documents légaux (Supabase CMS)
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  http: ^1.2.0
  yaml: ^3.1.2

# permission_handler_android 14.0.0 (tiré par permission_handler ^13.0.1) exige
# compileSdk 37 (preview, non requis par Google Play). On épingle la dernière
# version Android compatible SDK 36 en attendant qu'AGP supporte SDK 37.
dependency_overrides:
  permission_handler_android: 13.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon_profile/
    - assets/splash/
    - assets/sfx/
    - assets/images_pa/

  # —— POLICES ——
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/InstrumentSans-BoldItalic.ttf
          weight: 700
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_foreground: assets/app_icon.png
  adaptive_icon_background: "#000718"
  # Léger recul pour afficher le logo entier dans le masque circulaire Android.
  # Le fond reprend la couleur de l'image : la marge reste donc invisible.
  adaptive_icon_foreground_inset: 10
  remove_alpha_ios: true

flutter_native_splash:
  # Fond blanc pur sans aucun logo — 1er frame identique à _BootSplash Flutter
  color: "#FFFFFF"
  color_dark: "#06111F"
  image: assets/splash/transparent.png

  # Android 12 : icône transparente pour supprimer le logo système forcé
  android_12:
    color: "#FFFFFF"
    color_dark: "#06111F"
    image: assets/splash/transparent.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#06111F"